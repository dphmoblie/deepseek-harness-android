plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def envBuildValue = { String name ->
    def value = System.getenv(name) ?: ''
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def appSourceRoot = rootProject.projectDir.parentFile.canonicalFile
def legalAssetSources = [
    'legal/LICENSE'                             : new File(appSourceRoot, 'LICENSE'),
    'legal/THIRD_PARTY_NOTICES.md'              : new File(appSourceRoot, 'THIRD_PARTY_NOTICES.md'),
    'legal/licenses/react-LICENSE.txt'           : new File(appSourceRoot, 'node_modules/react/LICENSE'),
    'legal/licenses/react-dom-LICENSE.txt'       : new File(appSourceRoot, 'node_modules/react-dom/LICENSE'),
    'legal/licenses/capacitor-core-LICENSE.txt'  : new File(appSourceRoot, 'node_modules/@capacitor/core/LICENSE'),
    'legal/licenses/capacitor-android-LICENSE.txt': new File(appSourceRoot, 'node_modules/@capacitor/android/LICENSE'),
    'legal/licenses/xterm-LICENSE.txt'           : new File(appSourceRoot, 'node_modules/@xterm/xterm/LICENSE'),
    'legal/licenses/xterm-addon-fit-LICENSE.txt' : new File(appSourceRoot, 'node_modules/@xterm/addon-fit/LICENSE'),
    'legal/licenses/lucide-react-LICENSE.txt'    : new File(appSourceRoot, 'node_modules/lucide-react/LICENSE'),
    'legal/licenses/proot-GPL-2.0.txt'            : new File(appSourceRoot, 'legal/licenses/proot-GPL-2.0.txt'),
    'legal/licenses/operit2-AGPL-3.0.txt'         : new File(appSourceRoot, 'legal/licenses/operit2-AGPL-3.0.txt'),
    'legal/licenses/operit-terminal-core-LGPL-3.0.txt': new File(appSourceRoot, 'legal/licenses/operit-terminal-core-LGPL-3.0.txt'),
    'legal/licenses/gnu-LGPL-3.0.txt'              : new File(appSourceRoot, 'legal/licenses/gnu-LGPL-3.0.txt'),
    'legal/licenses/gnu-GPL-3.0.txt'               : new File(appSourceRoot, 'legal/licenses/gnu-GPL-3.0.txt'),
]
def unavailableLegalAssetSources = legalAssetSources.findAll { _, source ->
    !source.isFile() || !source.canRead() || source.length() == 0L
}
if (!unavailableLegalAssetSources.isEmpty()) {
    def unavailablePaths = unavailableLegalAssetSources.values()
        .collect { appSourceRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
        .sort()
        .join(', ')
    throw new GradleException(
        "Required APK legal material is missing, unreadable, or empty: ${unavailablePaths}. " +
            'Install the pinned JavaScript dependencies before configuring the Android build.'
    )
}

def generatedLegalAssetsDirectory = layout.buildDirectory.dir('generated/assets/legalBundle')
def generateLegalAssets = tasks.register('generateLegalAssets', Sync) {
    into(generatedLegalAssetsDirectory)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    legalAssetSources.each { assetPath, source ->
        def assetFile = new File(assetPath)
        from(source) {
            into(assetFile.parent.replace('\\', '/'))
            rename { assetFile.name }
        }
    }
}

android {
    namespace 'io.deepseekharness.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'io.deepseekharness.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.6'

        buildConfigField 'String', 'DEFAULT_MANIFEST_URL', envBuildValue('DSH_RUNTIME_MANIFEST_URL')
        buildConfigField 'String', 'DEFAULT_MANIFEST_SHA256', envBuildValue('DSH_RUNTIME_MANIFEST_SHA256')

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                cFlags '-Wall -Wextra -Werror -Wconversion -Wshadow -fstack-protector-strong'
            }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir(generatedLegalAssetsDirectory)
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libdsh_proot.so']
        }
        resources {
            // Curated license texts are APK assets; these exclusions only resolve dependency META-INF collisions.
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    androidResources {
        // The opaque suffix prevents AAPT from transparently expanding and renaming gzip assets.
        noCompress += ['bundle']
    }
}

tasks.named('preBuild').configure {
    dependsOn(generateLegalAssets)
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.17.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

if (file('capacitor.build.gradle').exists()) {
    apply from: 'capacitor.build.gradle'
}
