def useMavenMirror = (System.getenv('ENABLE_MAVEN_MIRROR') ?: System.getProperty('enableMavenMirror')) in ['1', 'true']

pluginManagement {
    repositories {
        if (useMavenMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        if (useMavenMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = 'DeepSeekHarnessMobile'
include ':app'

// `npx cap sync android` regenerates this file after dependencies are installed.
if (file('capacitor.settings.gradle').exists()) {
    apply from: 'capacitor.settings.gradle'
} else {
    include ':capacitor-android'
    project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
}
